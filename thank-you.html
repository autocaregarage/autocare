
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | AutoCare</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .thankyou-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f7fa;
      text-align: center;
    }

    .thankyou-card {
      max-width: 560px;
      width: 100%;
      padding: 48px 28px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(16, 25, 35, 0.08);
    }

    .success-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e6f7ed;
      color: #16834a;
      font-size: 40px;
      font-weight: bold;
    }

    .thankyou-card h1 {
      margin-bottom: 16px;
      color: #101923;
    }

    .thankyou-card p {
      color: #596575;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .home-button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 10px;
      background: #ff790f;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .home-button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <main class="thankyou-page">
    <div class="thankyou-card">
      <div class="success-icon">✓</div>

      <h1>Thank You!</h1>

      <p>
        Your appointment request has been received.
        Our team will contact you to confirm your
        preferred date and time.
      </p>

      <p>
        Please note that your appointment is not
        confirmed until our team contacts you.
      </p>

      <a class="home-button" href="index.html">
        Back to Home
      </a>
    </div>
  </main>
</body>
</html>
